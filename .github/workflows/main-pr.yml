name: Main PR checks

on:
  pull_request:
    branches: [ main ]

jobs:
  release-guard:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Enforce PR source branch == devel
      run: |
        if [ "${{ github.head_ref }}" != "devel" ]; then
          echo "PRs to main must come from devel"
          exit 1
        fi

    - name: Ensure HEAD is tagged
      run: |
        git describe --tags --exact-match HEAD >/dev/null 2>&1 || {
          echo "HEAD is not tagged"
          exit 1
        }

    - name: Validate tag format
      run: |
        tag=$(git describe --tags --exact-match HEAD)
        echo "Found tag: $tag"
        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "Invalid tag format"
          exit 1
        }
