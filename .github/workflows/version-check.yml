name: Version check

on:
  pull_request:
    branches:
      - main
      - devel
  workflow_dispatch:


jobs:
  version-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.ref || github.ref }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'


    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install package
      run: pip install packaging .


    - name: Get package version
      id: pkg
      run: |
        echo "version=$(sgs_tools_version --raw)" >> $GITHUB_OUTPUT

    - name: Get latest tag
      id: tag
      run: |
        tag=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
        echo "tag=${tag#v}" >> $GITHUB_OUTPUT

    - name: Compare versions
      run: |
        python - <<EOF
        from packaging.version import Version

        pkg = Version("${{ steps.pkg.outputs.version }}")
        tag = Version("${{ steps.tag.outputs.tag }}")

        if pkg == Version("0.0.0"):
            raise SystemExit("Version not resolved (dynamic versioning broken)")
        if pkg < tag:
            raise SystemExit(f"Version {pkg} is older than latest tag {tag}")

        print(f"OK: {pkg} >= {tag}")
        EOF
