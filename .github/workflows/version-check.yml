name: Version check

on:
  pull_request:
    branches: [ main, devel ]
  workflow_dispatch:
    inputs:
          ref:
            description: "Branch to test"
            required: false


jobs:
  version-check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install packaging
      run: pip install packaging

    - name: Install Poetry
      uses: abatilo/actions-poetry@v4.0.0

    - name: Cache Poetry dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install package
      run: poetry install --no-interaction

    - name: Get package version
      id: pkg
      run: |
        echo "version=$(sgs_tools_version --raw)" >> $GITHUB_OUTPUT

    - name: Get latest tag
      id: tag
      run: |
        git fetch --tags
        tag=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
        echo "tag=${tag#v}" >> $GITHUB_OUTPUT

    - name: Debug environment
      run: |
        which python
        which sgs_tools_version || echo "NOT FOUND"
        poetry run which sgs_tools_version || echo "NOT FOUND in poetry"

    - name: Compare versions
      run: |
        python - <<EOF
        from packaging.version import Version

        pkg = Version("${{ steps.pkg.outputs.version }}")
        tag = Version("${{ steps.tag.outputs.tag }}")
        print (f"Versions: pkg='{pkg}', tag='{tag}'")

        if pkg == Version("0.0.0"):
            raise SystemExit("Version not resolved (dynamic versioning broken)")
        if pkg < tag:
            raise SystemExit(f"Version {pkg} is older than latest tag {tag}")

        print(f"OK: {pkg} >= {tag}")
        EOF
